name: build and deploy to gh-pages

on:
  push:
    branches: [main]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Needed to push the build output to the gh-pages branch
permissions:
  contents: write

# Only one deployment at a time; a newer push supersedes an in-flight run.
concurrency:
  group: 'gh-pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Restore Next.js cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          # Generate a new cache whenever packages or source files change.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          # If source files changed but packages didn't, rebuild from a prior cache.
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      - name: Build with Next.js
        run: npm run build

      - name: Prepare build artifacts
        run: |
          # GitHub Pages serves files starting with an underscore only with Jekyll disabled
          touch out/.nojekyll
          # Custom domain for the site
          cp CNAME out/CNAME
          cat > out/README.md <<'EOF'
          # Hi!

          You're currently looking at the build artifacts of my website. To check out the code, switch over to the
          [main repository](https://github.com/samuel-ping/personal-website-v4)!

          #### Note - This message was automatically generated.
          EOF

      - name: Push build artifacts to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          user_name: 'github-actions[bot]'
          user_email: '41898282+github-actions[bot]@users.noreply.github.com'
          commit_message: 'deploy: ${{ github.event.head_commit.message || github.sha }}'
